name: Branch workflow rules
on:
  pull_request:
    types: [opened, reopened, edited]
jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: check_branch_names
        if: ${{ github.base_ref == 'main' && github.head_ref != 'staging' && !startsWith(github.event.pull_request.title, 'hotfix:') }}
        run: |
          echo "PRs into 'main' must come from 'staging' or have a title starting with 'hotfix:'"
          exit 1
