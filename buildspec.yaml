version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install build setuptools-scm

  pre_build:
    commands:
      - git rev-parse --is-inside-work-tree
      - git fetch --tags --force
      - git describe --tags --always
      - cd server && python -m setuptools_scm && cd ..

  build:
    commands:
      - ./deployment/elastic-beanstalk/build.sh
      - test -f build/elastic-beanstalk/bundle/application.py
      - test -f build/elastic-beanstalk/bundle/Procfile
      - test -f build/elastic-beanstalk/bundle/requirements.txt
      - find build/elastic-beanstalk/bundle/wheels -name '*.whl' -print -quit | grep .

artifacts:
  base-directory: build/elastic-beanstalk/bundle
  files:
    - "**/*"
    - ".ebextensions/**/*"
    - ".platform/**/*"
